version: '3.8'

services:
  api:
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "5003:5003"
    environment:
      - FLASK_ENV=development
      - FLASK_APP=server.py
    volumes:
      - ./app:/app
    command: python server.py
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5003/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
