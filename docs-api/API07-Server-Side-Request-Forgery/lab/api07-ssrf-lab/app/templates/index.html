<!DOCTYPE html>
<html>
<head>
    <title>API07: SSRF Lab</title>
    <style>
        body { font-family: Arial; max-width: 800px; margin: 0 auto; padding: 20px; }
        input { width: 100%; padding: 10px; margin: 10px 0; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; }
        .result { background: #f0f0f0; padding: 15px; margin: 15px 0; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>🔓 SSRF Vulnerability Lab</h1>
    
    <h2>Import Data from URL</h2>
    <input type="text" id="import-url" placeholder="https://example.com/data.json">
    <button onclick="importData()">Import Data</button>
    <div id="import-result" class="result"></div>
    
    <h2>Register Webhook</h2>
    <input type="text" id="webhook-url" placeholder="https://example.com/webhook">
    <button onclick="registerWebhook()">Register Webhook</button>
    <div id="webhook-result" class="result"></div>
    
    <h2>Fetch Image</h2>
    <input type="text" id="image-url" placeholder="https://example.com/image.jpg">
    <button onclick="fetchImage()">Fetch Image</button>
    <div id="image-result" class="result"></div>
    
    <h2>Hint: Try accessing internal endpoints</h2>
    <ul>
        <li>http://localhost:5000/internal/metadata</li>
        <li>http://localhost:5000/internal/database</li>
        <li>http://localhost:5000/internal/admin</li>
        <li>file:///etc/passwd (if running on Linux)</li>
    </ul>
    
    <script>
        async function importData() {
            const url = document.getElementById('import-url').value;
            const res = await fetch('/api/import-data', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({url: url})
            });
            const data = await res.json();
            document.getElementById('import-result').innerText = JSON.stringify(data, null, 2);
        }
        
        async function registerWebhook() {
            const url = document.getElementById('webhook-url').value;
            const res = await fetch('/api/webhook/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({callback_url: url})
            });
            const data = await res.json();
            document.getElementById('webhook-result').innerText = JSON.stringify(data, null, 2);
        }
        
        async function fetchImage() {
            const url = document.getElementById('image-url').value;
            const res = await fetch('/api/fetch-image', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({image_url: url})
            });
            const data = await res.json();
            document.getElementById('image-result').innerText = JSON.stringify(data, null, 2);
        }
    </script>
</body>
</html>
