version: '3.8'

services:
  llm02-app:
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "6002:5000"
    environment:
      - FLASK_APP=server.py
      - FLASK_ENV=development
    volumes:
      - ./app:/app
    command: python server.py
    networks:
      - llm02-network

networks:
  llm02-network:
    driver: bridge
