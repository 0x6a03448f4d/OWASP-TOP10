name: Lab Feedback
description: Provide feedback on a specific lab
title: "[LAB FEEDBACK]: "
labels: ["lab-feedback", "needs-review"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to provide feedback on our labs! Your input helps us improve the learning experience.

  - type: dropdown
    id: category
    attributes:
      label: Lab Category
      description: Which OWASP category is this lab from?
      options:
        - OWASP Web
        - OWASP API
        - OWASP LLM
        - OWASP Mobile
    validations:
      required: true

  - type: input
    id: lab-name
    attributes:
      label: Lab Name
      description: Which specific lab are you providing feedback on?
      placeholder: "e.g., 01-Broken-Access-Control/lab/broken-access-control-adminbutton"
    validations:
      required: true

  - type: dropdown
    id: experience
    attributes:
      label: Overall Experience
      description: How would you rate your overall experience with this lab?
      options:
        - ⭐⭐⭐⭐⭐ Excellent
        - ⭐⭐⭐⭐ Good
        - ⭐⭐⭐ Average
        - ⭐⭐ Poor
        - ⭐ Very Poor
    validations:
      required: true

  - type: dropdown
    id: difficulty
    attributes:
      label: Difficulty Level
      description: How would you rate the difficulty of this lab?
      options:
        - Too Easy
        - Just Right
        - Too Difficult
        - Unclear
    validations:
      required: true

  - type: dropdown
    id: clarity
    attributes:
      label: Instructions Clarity
      description: How clear were the lab instructions?
      options:
        - Very Clear
        - Clear
        - Somewhat Clear
        - Confusing
        - Very Confusing
    validations:
      required: true

  - type: checkboxes
    id: completion
    attributes:
      label: Completion Status
      description: Did you complete the lab?
      options:
        - label: I completed the lab successfully
        - label: I completed the lab with difficulty
        - label: I could not complete the lab

  - type: textarea
    id: what-worked
    attributes:
      label: What Worked Well
      description: What aspects of the lab did you find helpful or effective?
      placeholder: Describe what you liked about the lab
    validations:
      required: true

  - type: textarea
    id: what-needs-improvement
    attributes:
      label: What Needs Improvement
      description: What aspects could be better?
      placeholder: Describe areas for improvement

  - type: textarea
    id: technical-issues
    attributes:
      label: Technical Issues
      description: Did you encounter any technical problems?
      placeholder: |
        - Docker issues
        - Port conflicts
        - Installation problems
        - Runtime errors
        - etc.

  - type: dropdown
    id: learning-value
    attributes:
      label: Learning Value
      description: How valuable was this lab for learning?
      options:
        - Extremely Valuable
        - Very Valuable
        - Moderately Valuable
        - Slightly Valuable
        - Not Valuable
    validations:
      required: true

  - type: textarea
    id: suggestions
    attributes:
      label: Suggestions for Improvement
      description: What specific changes would you suggest?
      placeholder: |
        - Add more examples
        - Improve documentation
        - Add hints
        - etc.

  - type: input
    id: time-spent
    attributes:
      label: Time Spent
      description: Approximately how long did it take you to complete this lab?
      placeholder: "e.g., 30 minutes, 1 hour, 2 hours"

  - type: dropdown
    id: experience-level
    attributes:
      label: Your Experience Level
      description: What is your experience level with security topics?
      options:
        - Beginner
        - Intermediate
        - Advanced
        - Expert

  - type: textarea
    id: additional
    attributes:
      label: Additional Comments
      description: Any other feedback or comments
      placeholder: Share any additional thoughts
