name: Bug Report
description: Report a bug or issue with the repository
title: "[BUG]: "
labels: ["bug", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the form below.
        
        **Note**: If you're reporting an intentional vulnerability in a lab (they're meant to be vulnerable), this is not a bug.

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      description: Please verify the following before submitting
      options:
        - label: I have searched existing issues to ensure this is not a duplicate
          required: true
        - label: I understand that labs are intentionally vulnerable (not a bug)
          required: true
        - label: This is an actual bug, not an intentional educational vulnerability
          required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      description: What category does this bug affect?
      options:
        - OWASP Web
        - OWASP API
        - OWASP LLM
        - OWASP Mobile
        - Documentation
        - Lab Environment (Docker)
        - Repository Infrastructure
        - Other
    validations:
      required: true

  - type: input
    id: vulnerability
    attributes:
      label: Specific Vulnerability (if applicable)
      description: Which vulnerability topic is affected? (e.g., "01-Broken-Access-Control")
      placeholder: "e.g., 03-Injection"

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug
      placeholder: Describe what happened vs what you expected
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Navigate to '...'
        2. Run command '...'
        3. See error '...'
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: Describe the expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: Describe what actually happened
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Please provide information about your environment
      placeholder: |
        - OS: [e.g., Ubuntu 22.04, macOS 13, Windows 11]
        - Docker version: [e.g., 24.0.5]
        - Browser (if applicable): [e.g., Chrome 120]
      value: |
        - OS: 
        - Docker version: 
        - Browser: 
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs/Screenshots
      description: Add any relevant logs, error messages, or screenshots
      placeholder: Paste logs or drag-and-drop screenshots here

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context about the problem
      placeholder: Any additional information that might help
