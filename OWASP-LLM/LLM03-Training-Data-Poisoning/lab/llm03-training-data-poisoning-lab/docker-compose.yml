version: '3.8'

services:
  llm03-app:
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "6003:5000"
    environment:
      - FLASK_APP=server.py
      - FLASK_ENV=development
    volumes:
      - ./app:/app
    command: python server.py
    networks:
      - llm03-network

networks:
  llm03-network:
    driver: bridge
