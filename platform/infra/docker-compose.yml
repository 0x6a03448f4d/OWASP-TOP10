services:
  # Main Dashboard - Web Interface
  dashboard:
    image: nginx:alpine
    container_name: owasp-dashboard
    ports:
      - "80:80"
    volumes:
      - ../frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - owasp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Lab Management API - Simple Python service to start/stop labs
  lab-manager:
    build:
      context: .
      dockerfile: Dockerfile.lab-manager
    container_name: owasp-lab-manager
    ports:
      - "4999:5000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../../:/workspace:ro
    networks:
      - owasp-network
    restart: unless-stopped
    environment:
      - FLASK_ENV=production
      - LAB_NETWORK=owasp-network
      - HOST_PROJECT_ROOT=${PWD}
    working_dir: /workspace/platform/backend
    command: python app.py

networks:
  owasp-network:
    driver: bridge
    name: owasp-network

# Individual labs are started on-demand via the lab-manager service
# The dashboard provides UI buttons to start/stop labs
