version: '3.8'

services:
  api:
    build: ./app
    container_name: api04-vulnerable-api
    ports:
      - "5004:5000"
    environment:
      - FLASK_APP=server.py
      - FLASK_ENV=development
      - DATABASE_URL=sqlite:///vulnerable.db
    volumes:
      - ./app:/app
    command: python server.py
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
