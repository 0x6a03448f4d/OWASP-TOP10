<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Injection Lab</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        header {
            background: white;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        .warning {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            margin: 20px 0;
            border-radius: 5px;
        }
        input[type="text"], input[type="password"], textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            margin: 10px 0;
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin: 5px;
        }
        .btn-primary {
            background: #007bff;
            color: white;
        }
        .btn-danger {
            background: #dc3545;
            color: white;
        }
        .btn-success {
            background: #28a745;
            color: white;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            font-family: monospace;
        }
        .result-danger {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
        }
        .result-success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
        }
    </style>
</head>
<body>
    <div class="container">
        
<header>
    <h1>🔍 Injection Lab: Unsafe Query</h1>
    <p>Demonstrate SQL injection vulnerability concept (SAFE MOCK)</p>
    <div class="warning">
        <strong>⚠️ Educational Purpose Only</strong> - This is a safe mock demonstration. No real database or SQL injection possible.
    </div>
</header>

<div class="card">
    <h2>Product Search</h2>
    <input type="text" id="searchTerm" placeholder="Search for products (try: Laptop)">
    <button class="btn-danger" onclick="searchVulnerable()">Search (Vulnerable)</button>
    <button class="btn-success" onclick="searchSecure()">Search (Secure)</button>
    <div id="result"></div>
</div>

<script>
async function searchVulnerable() {
    const searchTerm = document.getElementById('searchTerm').value;
    const response = await fetch('/search/vulnerable', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({search: searchTerm})
    });
    const data = await response.json();
    displayResult(data, 'danger');
}

async function searchSecure() {
    const searchTerm = document.getElementById('searchTerm').value;
    const response = await fetch('/search/secure', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({search: searchTerm})
    });
    const data = await response.json();
    displayResult(data, 'success');
}

function displayResult(data, type) {
    const resultDiv = document.getElementById('result');
    resultDiv.className = `result-${type}`;
    resultDiv.innerHTML = `
        <strong>Method:</strong> ${data.method}<br>
        <strong>Input:</strong> ${data.input}<br>
        <strong>Query:</strong> ${data.simulated_query || data.query || 'N/A'}<br>
        <strong>Results:</strong> ${JSON.stringify(data.results, null, 2)}<br>
        ${data.warning ? `<br><strong>⚠️ Warning:</strong> ${data.warning}` : ''}
        ${data.explanation ? `<br><strong>Info:</strong> ${data.explanation}` : ''}
    `;
}
</script>

    </div>
</body>
</html>
